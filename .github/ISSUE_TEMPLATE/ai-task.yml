name: AI agent task
description: A change for the AI agent pipeline. A maintainer reviews it and adds the `ai-agent` label to start planning.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        The agent works only from what is written here, so be specific.
        See "Issue Creation Guidelines" in DEVELOPMENT_WORKFLOW.md.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Feature
        - Bug fix
        - Refactor
        - Tests
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what should change and why.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Detailed requirements
      description: Behaviour, API endpoints and fields, UI changes, validation rules.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes. The agent turns these into tests.
      placeholder: |
        - [ ] PATCH /api/tasks/:id accepts `dueDate` (ISO date, optional)
        - [ ] Tasks past their due date show an "Overdue" badge
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related files, out-of-scope items, constraints.
